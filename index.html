<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to ASCII</title>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  
  <body>
    <div class="header">
      <p class="Title">Image to ASCII</p>
    </div>

    <div class="main-container">
      <div id="text-container"><!-- ASCII art will appear here --></div>
    </div>

    <!-- Fixed controls at the bottom -->
    <div id="bottom-controls">
      <div class="upload-container">
        <button id="custom-upload-button" style="--clr:#ff0000">CHOOSE IMAGE</button>
        <input type="file" id="image-upload" accept="image/*" hidden>
      </div>
      <div class="sample-image-container">
        <img id="sample-image" src="dog_of.jpeg" alt="Sample Image">
      </div>
      <div class="slider-container">
        <label for="density-slider">Density:</label>
        <input type="range" id="density-slider" min="2" max="50" value="20">
        <input type="number" id="density-input" min="2" max="50" value="20" style="width:50px;">
        <span id="density-value">20</span>
      </div>
      <div class="copy-container">
        <button id="copy-button">COPY ASCII</button>
      </div>
    </div>

    <script src="libraries/p5.min.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
